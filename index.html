<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vazifalar</title>
<meta name="description" content="Vazifalar ro'yxati — Google Drive bilan sinxronlanadi">
<meta name="theme-color" content="#05070c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#05070c; --surface:#0b1222; --surface2:#111b31; --line:#1c2a47; --line2:#26385e;
  --navy:#1e3a8a; --navy2:#2848a8; --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14);
  --text:#e8edf7; --muted:#8692ab; --dim:#5d6a85;
  --red:#ff6b7a; --amber:#f5b84a; --green:#4fd1a1;
  --radius:16px;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%, #0d1d45 0%, var(--bg) 60%) fixed, var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(5,7,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:10px;height:64px}
.logo{flex:1;min-width:0}
.logo b{display:block;font-size:20px;letter-spacing:.2px}
.logo small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill.ok .dot{background:var(--green)} .pill.busy .dot{background:var(--amber);animation:pulse 1s infinite}
.pill.warn .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.late b{color:var(--red)} .stat.today b{color:var(--accent)} .stat.done b{color:var(--green)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 15px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy2);font-weight:600;box-shadow:0 4px 14px rgba(30,58,138,.45)}
.tab .n{opacity:.75;margin-left:5px;font-size:12px}
.lists{padding-top:8px}
.lists .tab{padding:6px 13px;font-size:13px}
.lists .tab.on{background:var(--accent-soft);color:var(--text);border-color:var(--accent);box-shadow:none}

/* banner */
.banner{margin:14px 0 0;padding:12px 14px;border-radius:var(--radius);background:linear-gradient(135deg,#0f1f47,#0b1426);border:1px solid var(--line2);display:flex;gap:12px;align-items:center;font-size:14px}
.banner p{margin:0;flex:1;color:#c9d4ec}
.btn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(30,58,138,.4)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid #4a2230;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:14px}

/* tasks */
h2.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 2px 8px;font-weight:600}
h2.sec.late{color:var(--red)}
.task{position:relative;display:flex;align-items:stretch;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;overflow:hidden;cursor:pointer}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim)}
.task.p2::before{background:var(--amber)} .task.p3::before{background:var(--red)} .task.p1::before{background:var(--accent)}
.dleft{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding:10px 0 10px 4px;background:rgba(30,58,138,.12)}
.dleft .dd{font-size:21px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dleft .mm{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:lowercase}
.mid{flex:1;min-width:0;display:flex;gap:11px;align-items:flex-start;padding:12px 10px 12px 12px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .check svg{opacity:1}
.tx{min-width:0;flex:1}
.title{font-size:15.5px;word-wrap:break-word;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.tag.p3{color:var(--red);border-color:rgba(255,107,122,.35);background:rgba(255,107,122,.08)}
.tag.p2{color:var(--amber);border-color:rgba(245,184,74,.35);background:rgba(245,184,74,.08)}
.tag.p1{color:#9fb6e8}
.dright{flex:none;min-width:84px;max-width:104px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:10px 14px 10px 6px;text-align:right}
.dright .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dright .val{font-size:13.5px;font-weight:600;margin-top:2px;color:#c9d4ec}
.dright .val.late{color:var(--red)} .dright .val.today{color:var(--accent)} .dright .val.none{color:var(--dim);font-weight:400}
.task.done .dright .val{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.empty .ic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* FAB */
.fab{position:fixed;right:max(18px,calc(50% - 322px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:15;width:62px;height:62px;border-radius:20px;border:1px solid #3a5bc0;
  background:linear-gradient(160deg,#3256c4,#1a2f72);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(30,58,138,.6),0 0 0 6px rgba(5,7,12,.6)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,2,8,.7);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:linear-gradient(180deg,#0e1830,#0a1122);width:100%;max-width:680px;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;border:1px solid var(--line2);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line2)}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h3{margin:0 0 16px;font-size:19px}
.field{margin-bottom:16px}
.field>label,.flabel{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500;letter-spacing:.02em}
.field input[type=text],.field input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;font-size:16px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input[type=date]{min-height:50px}
.field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7) sepia(1) hue-rotate(190deg) saturate(4);cursor:pointer;opacity:.9}
.seg{display:flex;gap:8px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 6px;font-size:14.5px;color:var(--muted)}
.seg button .d{width:9px;height:9px;border-radius:50%}
.seg button.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.seg.prio button[data-p="3"].on{border-color:var(--red);background:rgba(255,107,122,.1)}
.seg.prio button[data-p="2"].on{border-color:var(--amber);background:rgba(245,184,74,.1)}
.seg.rep button{font-size:13.5px;padding:10px 4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.days button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;font-size:14px;color:var(--muted);font-weight:600}
.days button.on{background:var(--navy);border-color:var(--accent);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.tag.rep{color:#b9c9f5;border-color:rgba(91,140,255,.35);background:var(--accent-soft)}
.actions{display:flex;gap:8px;margin-top:20px;align-items:center}
.actions .grow{flex:1}
.actions .btn.main{flex:1;padding:14px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h4{margin:0 0 6px;font-size:15px}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16244a;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo"><b>Vazifalar</b><small id="todayText"></small></div>
    <button class="pill" id="syncPill" title="Sinxronlash"><span class="dot"></span><span id="syncText">Faqat telefonda</span></button>
    <button class="iconbtn" id="installBtn" hidden title="O'rnatish" aria-label="O'rnatish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
    </button>
    <button class="iconbtn" id="settingsBtn" title="Sozlamalar" aria-label="Sozlamalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="connectBanner" hidden>
    <p id="bannerText"></p>
    <button class="btn sm" id="bannerBtn">Ulash</button>
  </div>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="viewTabs"></nav>
  <nav class="tabs lists" id="listTabs"></nav>
  <div id="taskArea"></div>
</main>

<button class="fab" id="fab" aria-label="Yangi vazifa">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Task sheet -->
<div class="scrim" id="editScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="grab"></div>
    <h3 id="editTitle">Yangi vazifa</h3>
    <div class="field"><label for="fTitle">Vazifa</label><input type="text" id="fTitle" maxlength="300" placeholder="Nima qilish kerak?" enterkeyhint="done"></div>
    <div class="field"><label for="fDue">Muddat</label><input type="date" id="fDue"></div>
    <div class="field"><span class="flabel">Takrorlash</span>
      <div class="seg rep" id="fRep">
        <button type="button" data-r="">Yo'q</button>
        <button type="button" data-r="daily">Har kuni</button>
        <button type="button" data-r="weekly">Har hafta</button>
        <button type="button" data-r="days">Kunlar</button>
      </div>
      <div class="days" id="fDays" hidden>
        <button type="button" data-w="1">Du</button><button type="button" data-w="2">Se</button><button type="button" data-w="3">Ch</button><button type="button" data-w="4">Pa</button><button type="button" data-w="5">Ju</button><button type="button" data-w="6">Sh</button><button type="button" data-w="0">Ya</button>
      </div>
      <div class="hint" id="repHint" hidden></div>
    </div>
    <div class="field"><span class="flabel">Ro'yxat</span>
      <div class="seg" id="fList">
        <button type="button" data-l="shaxsiy">Shaxsiy</button>
        <button type="button" data-l="ish">Ish</button>
      </div>
    </div>
    <div class="field"><span class="flabel">Muhimlik darajasi</span>
      <div class="seg prio" id="fPrio">
        <button type="button" data-p="1"><span class="d" style="background:var(--accent)"></span>Oddiy</button>
        <button type="button" data-p="2"><span class="d" style="background:var(--amber)"></span>O'rta</button>
        <button type="button" data-p="3"><span class="d" style="background:var(--red)"></span>Muhim</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn danger" id="delBtn" hidden>O'chirish</button>
      <button class="btn ghost" id="cancelBtn">Bekor</button>
      <button class="btn main" id="saveBtn">Qo'shish</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="scrim" id="setScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="grab"></div>
    <h3 id="setTitle">Sozlamalar</h3>
    <div class="card">
      <h4>Google Drive sinxronizatsiyasi</h4>
      <p id="gStatus">Ulanmagan.</p>
      <div class="actions" style="margin-top:6px">
        <button class="btn" id="gConnect">Google bilan ulash</button>
        <button class="btn ghost" id="gSyncNow" hidden>Hozir sinxronlash</button>
        <button class="btn danger" id="gDisconnect" hidden>Uzish</button>
      </div>
    </div>
    <div class="card">
      <h4>Zaxira nusxa</h4>
      <p>Barcha vazifalarni fayl sifatida yuklab olish yoki fayldan tiklash.</p>
      <div class="actions" style="margin-top:0">
        <button class="btn ghost sm" id="exportBtn">Yuklab olish</button>
        <button class="btn ghost sm" id="importBtn">Fayldan tiklash</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="actions"><span class="grow"></span><button class="btn" id="setClose">Yopish</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ================= Storage & model ================= */
const KEY = 'vz_data_v1';
const SKEY = 'vz_sync_v1';
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = id => document.getElementById(id);

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const LISTS = [{ id:'shaxsiy', name:'Shaxsiy' }, { id:'ish', name:'Ish' }];
const listName = id => (LISTS.find(l => l.id === id) || {}).name || '';

let data = lsGet(KEY, null) || { tasks: [], lists: [] };

/* Keep only Shaxsiy and Ish; move tasks from removed lists to Shaxsiy. Returns true if anything changed. */
function migrate(){
  let ch = false;
  data.lists = data.lists || [];
  for(const L of LISTS){
    const l = data.lists.find(x => x.id === L.id);
    if(!l){ data.lists.push({ id:L.id, name:L.name, updatedAt:now() }); ch = true; }
    else if(l.deleted){ l.deleted = false; l.updatedAt = now(); ch = true; }
  }
  for(const l of data.lists){
    if(!LISTS.some(L => L.id === l.id) && !l.deleted){ l.deleted = true; l.updatedAt = now(); ch = true; }
  }
  for(const t of data.tasks){
    if(!t.deleted && !LISTS.some(L => L.id === t.list)){ t.list = 'shaxsiy'; t.updatedAt = now(); ch = true; }
  }
  return ch;
}

const BUILTIN_CID = '97733040035-1m37637vgug47qg1a57e6hou2i4s07pn.apps.googleusercontent.com';
let sync = Object.assign({ clientId:'', fileId:'', token:'', exp:0, lastSync:0, connected:false, dirty:false }, lsGet(SKEY, {}));
if(sync.clientId !== BUILTIN_CID){ Object.assign(sync, { clientId: BUILTIN_CID, token:'', exp:0, connected:false }); }

function saveLocal(){ lsSet(KEY, data); }
function saveSync(){ lsSet(SKEY, sync); }
if(migrate()){ saveLocal(); sync.dirty = true; saveSync(); }
const tasks = () => data.tasks.filter(t => !t.deleted);
function touch(obj){ obj.updatedAt = now(); }
function changed(){ saveLocal(); render(); sync.dirty = true; saveSync(); scheduleSync(); }

/* ================= Dates ================= */
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const MON3 = ['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const DAYS = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); }
const today = () => addDays(0);
function dueLabel(s){
  if(!s) return { text:'Belgilanmagan', cls:'none' };
  const t = today();
  if(s === t) return { text:'Bugun', cls:'today' };
  if(s === addDays(1)) return { text:'Ertaga', cls:'' };
  if(s === addDays(-1)) return { text:'Kecha', cls:'late' };
  const [y,m,d] = s.split('-').map(Number);
  const text = d + '-' + MONTHS[m-1] + (y !== new Date().getFullYear() ? ' ' + y : '');
  return { text, cls: s < t ? 'late' : '' };
}

/* ================= Repeating ================= */
const WD_SHORT = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const WD_ORDER = [1,2,3,4,5,6,0];
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function repMatch(rep, days, wd, d){
  if(rep === 'daily') return true;
  if(rep === 'weekly') return d.getDay() === wd;
  if(rep === 'days') return (days || []).includes(d.getDay());
  return false;
}
/* first matching date on or after s */
function firstFrom(rep, days, wd, s){
  const d = parseD(s);
  for(let i = 0; i < 8 && !repMatch(rep, days, wd, d); i++) d.setDate(d.getDate()+1);
  return ymd(d);
}
/* next occurrence after the current due; if that is already in the past, the first one from today */
function nextDue(t){
  const base = t.due || today();
  const wd = parseD(base).getDay();
  const d = parseD(base);
  for(let i = 0; i < 8; i++){ d.setDate(d.getDate()+1); if(repMatch(t.rep, t.repDays, wd, d)) break; }
  let s = ymd(d);
  if(s < today()) s = firstFrom(t.rep, t.repDays, wd, today());
  return s;
}
function repText(t){
  if(t.rep === 'daily') return 'Har kuni';
  if(t.rep === 'weekly') return 'Har ' + DAYS[parseD(t.due || today()).getDay()].toLowerCase();
  if(t.rep === 'days'){
    const ds = WD_ORDER.filter(w => (t.repDays || []).includes(w));
    return ds.length === 7 ? 'Har kuni' : ds.map(w => WD_SHORT[w]).join(', ');
  }
  return '';
}

/* ================= UI state ================= */
let view = 'today';   // today | upcoming | repeat | done
let listFilter = '';  // '' = both lists; tap a list chip again to clear
const VIEWS = [['today','Bugun'],['upcoming','Rejali'],['repeat','Takroriy'],['done','Bajarilgan']];
const KEEP_DONE_DAYS = 30;

/* which section a task belongs to */
function sectionOf(t){
  if(t.done) return 'done';
  if(t.rep) return 'repeat';
  if(t.due && t.due <= today()) return 'today';
  return 'upcoming';
}
/* completed tasks are kept for 30 days, then removed automatically */
function purgeDone(){
  const cut = now() - KEEP_DONE_DAYS*864e5;
  let ch = false;
  for(const t of data.tasks){
    if(!t.deleted && t.done && (t.doneAt || t.updatedAt || 0) < cut){ t.deleted = true; t.updatedAt = now(); ch = true; }
  }
  return ch;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function inView(t, v){ return sectionOf(t) === v; }
function sortActive(a,b){
  if(a.due !== b.due){ if(!a.due) return 1; if(!b.due) return -1; return a.due < b.due ? -1 : 1; }
  if((b.prio||1) !== (a.prio||1)) return (b.prio||1) - (a.prio||1);
  return a.createdAt - b.createdAt;
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#04140d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PRIO = { 1:'Oddiy', 2:"O'rta", 3:'Muhim' };

function taskHTML(t){
  const c = new Date(t.createdAt || now());
  const dl = dueLabel(t.due);
  const p = t.prio || 1;
  return `<div class="task p${p}${t.done?' done':''}" data-id="${esc(t.id)}">
    <div class="dleft" title="Qo'shilgan sana"><span class="dd">${c.getDate()}</span><span class="mm">${MON3[c.getMonth()]}</span></div>
    <div class="mid">
      <button class="check" data-act="toggle" aria-label="Bajarildi">${CHECK_SVG}</button>
      <div class="tx">
        <div class="title">${esc(t.title)}</div>
        <div class="tags">${t.rep ? `<span class="tag rep">↻ ${esc(repText(t))}</span>` : ''}${t.list ? `<span class="tag">${esc(listName(t.list))}</span>` : ''}<span class="tag p${p}">${PRIO[p]}</span></div>
      </div>
    </div>
    <div class="dright"><span class="lbl">Muddat</span><span class="val ${dl.cls}">${esc(dl.text)}</span></div>
  </div>`;
}

function render(){
  const d = new Date();
  $('todayText').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + '-' + MONTHS[d.getMonth()];

  const all = tasks().filter(t => !listFilter || t.list === listFilter);
  const td = today();
  const active = all.filter(t => !t.done && !t.rep);
  const nLate = active.filter(t => t.due && t.due < td).length;
  const nToday = active.filter(t => t.due === td).length;
  const nDone = all.filter(t => t.done).length;
  $('stats').innerHTML =
    `<div class="stat today"><b>${nToday}</b><span>Bugun</span></div>` +
    `<div class="stat late"><b>${nLate}</b><span>Muddati o'tgan</span></div>` +
    `<div class="stat done"><b>${nDone}</b><span>Bajarilgan</span></div>`;

  $('viewTabs').innerHTML = VIEWS.map(([k,n]) => {
    const c = all.filter(t => inView(t,k)).length;
    return `<button class="tab${view===k?' on':''}" data-view="${k}">${n}${c?`<span class="n">${c}</span>`:''}</button>`;
  }).join('');
  $('listTabs').innerHTML = LISTS.map(l => `<button class="tab${listFilter===l.id?' on':''}" data-list="${l.id}">${l.name}</button>`).join('');

  const items = all.filter(t => inView(t, view));
  let html = '';
  if(view === 'done'){
    items.sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
    if(items.length) html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px"><span class="small" style="color:var(--muted);font-size:12.5px">Bajarilgan vazifalar ${KEEP_DONE_DAYS} kun saqlanadi</span><button class="btn ghost sm" id="clearDone">Tozalash</button></div>`;
    let last = '';
    items.forEach(t => {
      const d = ymd(new Date(t.doneAt || t.updatedAt || now()));
      if(d !== last){ last = d; html += `<h2 class="sec">${esc(dueLabel(d).text)}</h2>`; }
      html += taskHTML(t);
    });
  } else if(view === 'upcoming'){
    const dated = items.filter(t => t.due).sort(sortActive);
    const nodue = items.filter(t => !t.due).sort(sortActive);
    if(dated.length) html += `<h2 class="sec">Kelgusi</h2>` + dated.map(taskHTML).join('');
    if(nodue.length) html += `<h2 class="sec">Muddatsiz</h2>` + nodue.map(taskHTML).join('');
  } else if(view === 'today'){
    const late = items.filter(t => t.due < td).sort(sortActive);
    const tod = items.filter(t => t.due === td).sort(sortActive);
    if(late.length) html += `<h2 class="sec late">Muddati o'tgan</h2>` + late.map(taskHTML).join('');
    if(tod.length) html += `<h2 class="sec">Bugun</h2>` + tod.map(taskHTML).join('');
  } else {
    items.sort(sortActive);
    const late = items.filter(t => t.due && t.due < td);
    const rest = items.filter(t => !(t.due && t.due < td));
    if(late.length) html += `<h2 class="sec late">Muddati o'tgan</h2>` + late.map(taskHTML).join('');
    if(rest.length) html += `<h2 class="sec">Takrorlanadigan vazifalar</h2>` + rest.map(taskHTML).join('');
  }
  if(!items.length){
    const msg = {
      today:['Bugun uchun vazifa yo\'q','Muddatini bugunga qo\'ygan vazifalaringiz shu yerda chiqadi. Qo\'shish uchun + tugmasini bosing.'],
      upcoming:['Rejalashtirilgan vazifa yo\'q','Muddatini kelgusi kunlarga qo\'ygan vazifalaringiz shu yerda chiqadi.'],
      repeat:['Takrorlanadigan vazifa yo\'q','Vazifa qo\'shayotganda "Takrorlash" dan Har kuni, Har hafta yoki Kunlar ni tanlang.'],
      done:['Hali bajarilgan vazifa yo\'q','Vazifani bajarganda doirachani bosing.']
    }[view];
    html = `<div class="empty"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div><b>${msg[0]}</b>${msg[1]}</div>`;
  }
  $('taskArea').innerHTML = html;
  renderSyncUI();
}

      t.deleted = true; touch(t);
      toast('Bekor qilindi');
    } else {
      t.done = !t.done; t.doneAt = t.done ? now() : 0; touch(t);
      if(t.done) toast('Bajarildi ✓');
    }
    changed();
  } else openSheet(t);
});

/* ================= Merge ================= */
function mergeArr(a = [], b = []){
  const m = new Map();
  for(const x of a) if(x && x.id) m.set(x.id, x);
  for(const y of b){
    if(!y || !y.id) continue;
    const x = m.get(y.id);
    if(!x || (y.updatedAt||0) > (x.updatedAt||0)) m.set(y.id, y);
  }
  return [...m.values()];
}
function merge(a, b){
  const out = { tasks: mergeArr(a.tasks, b.tasks), lists: mergeArr(a.lists, b.lists) };
  const cut = now() - 60*864e5;
  out.tasks = out.tasks.filter(t => !(t.deleted && t.updatedAt < cut));
  out.lists = out.lists.filter(l => !(l.deleted && l.updatedAt < cut));
  return out;
}
window.__vzMerge = merge;

/* ================= Google Drive sync ================= */
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'Vazifalar (sinxron).json';
let tokenClient = null, gisLoading = null, syncing = false, syncAgain = false, syncTimer = null, syncError = '';

const tokenValid = () => sync.token && sync.exp > now() + 60000;

function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gisLoading) return gisLoading;
  gisLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => { gisLoading = null; rej(new Error('offline')); };
    document.head.appendChild(s);
  });
  return gisLoading;
}

async function requestToken(firstTime){
  try{ await loadGis(); }catch(e){ toast('Google bilan bog\'lanib bo\'lmadi. Internetni tekshiring.'); return; }
  if(!tokenClient){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: sync.clientId, scope: SCOPE,
      callback: resp => {
        if(resp.error){ syncError = 'Ulanish rad etildi'; renderSyncUI(); return; }
        sync.token = resp.access_token; sync.exp = now() + (resp.expires_in||3600)*1000;
        sync.connected = true; syncError = ''; saveSync();
        toast('Google Drive ulandi'); doSync();
      },
      error_callback: err => { syncError = err && err.type === 'popup_closed' ? '' : 'Ulanishda xato'; renderSyncUI(); }
    });
  }
  tokenClient.requestAccessToken({ prompt: firstTime ? 'consent' : '' });
}

async function api(url, opts = {}){
  opts.headers = Object.assign({ Authorization: 'Bearer ' + sync.token }, opts.headers || {});
  const r = await fetch(url, opts);
  if(r.status === 401){ sync.token = ''; sync.exp = 0; saveSync(); const e = new Error('auth'); e.auth = true; throw e; }
  if(!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r;
}

async function findFile(){
  if(sync.fileId){
    try{
      const r = await api(`https://www.googleapis.com/drive/v3/files/${sync.fileId}?fields=id,trashed`);
      const j = await r.json(); if(!j.trashed) return sync.fileId;
    }catch(e){ if(e.auth) throw e; }
  }
  const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
  const r = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id)`);
  const j = await r.json();
  sync.fileId = (j.files && j.files[0] && j.files[0].id) || '';
  saveSync();
  return sync.fileId;
}

async function doSync(){
  if(!sync.connected || !tokenValid()){ renderSyncUI(); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true; syncError = ''; renderSyncUI();
  try{
    const id = await findFile();
    let remote = null;
    if(id){
      const r = await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
      try{ remote = JSON.parse(await r.text()); }catch(e){ remote = null; }
    }
    const before = JSON.stringify(data);
    if(remote && Array.isArray(remote.tasks)){ data = merge(data, remote); migrate(); }
    purgeDone();
    const body = JSON.stringify({ app:'Vazifalar', version:2, savedAt:new Date().toISOString(), tasks:data.tasks, lists:data.lists });
    const norm = x => JSON.stringify(merge(x, {tasks:[],lists:[]}));
    const remoteSame = remote && norm(remote) === norm(data);
    if(!id){
      const boundary = 'vz' + uid();
      const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        JSON.stringify({ name: FILE_NAME, mimeType:'application/json' }) +
        `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST', headers:{ 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
      sync.fileId = (await r.json()).id;
    } else if(!remoteSame){
      await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method:'PATCH', headers:{ 'Content-Type':'application/json' }, body });
    }
    sync.lastSync = now(); sync.dirty = false; saveSync();
    if(JSON.stringify(data) !== before){ saveLocal(); render(); }
  }catch(e){
    syncError = e.auth ? '' : (navigator.onLine ? 'Sinxronlashda xato' : 'Internet yo\'q');
    console.warn('sync', e);
  }finally{
    syncing = false; renderSyncUI();
    if(syncAgain){ syncAgain = false; doSync(); }
  }
}

function scheduleSync(){
  clearTimeout(syncTimer);
  if(sync.connected && tokenValid()) syncTimer = setTimeout(doSync, 1200);
  else renderSyncUI();
}

function timeAgo(t){
  if(!t) return '';
  const s = Math.round((now()-t)/1000);
  if(s < 60) return 'hozirgina';
  if(s < 3600) return Math.round(s/60) + ' daqiqa oldin';
  if(s < 86400) return Math.round(s/3600) + ' soat oldin';
  return new Date(t).toLocaleDateString();
}

function renderSyncUI(){
  const pill = $('syncPill'), txt = $('syncText');
  pill.className = 'pill';
  let banner = false, bannerText = '', bannerBtn = 'Ulash';
  if(!sync.connected){
    txt.textContent = 'Ulanmagan';
    banner = true;
    bannerText = 'Vazifalarni Google Drive\'ga saqlash va boshqa qurilmalarda ko\'rish uchun hisobingizni ulang.';
  } else if(syncing){
    pill.classList.add('busy'); txt.textContent = 'Sinxronlanmoqda…';
  } else if(!tokenValid()){
    pill.classList.add('warn'); txt.textContent = sync.dirty ? 'Saqlanmagan' : 'Qayta ulash';
    if(sync.dirty){ banner = true; bannerBtn = 'Sinxronlash'; bannerText = 'O\'zgarishlar hali Google Drive\'ga yuborilmadi.'; }
  } else if(syncError){
    pill.classList.add('warn'); txt.textContent = syncError;
  } else {
    pill.classList.add('ok'); txt.textContent = 'Drive ✓';
  }
  $('connectBanner').hidden = !banner;
  $('bannerText').textContent = bannerText;
  $('bannerBtn').textContent = bannerBtn;

  $('gStatus').textContent = !sync.connected ? 'Ulanmagan. Vazifalar faqat shu qurilmada saqlanmoqda.'
    : 'Ulangan. Drive\'dagi fayl: "' + FILE_NAME + '". ' + (sync.lastSync ? 'Oxirgi sinxronlash: ' + timeAgo(sync.lastSync) + '.' : '');
  $('gConnect').hidden = sync.connected;
  $('gSyncNow').hidden = !sync.connected;
  $('gDisconnect').hidden = !sync.connected;
}

  if(!sync.connected) requestToken(true);
  else if(!tokenValid()) requestToken(false);
  else doSync();
}
$('syncPill').onclick = syncTap;
$('bannerBtn').onclick = syncTap;
$('gSyncNow').onclick = syncTap;
$('gConnect').onclick = () => requestToken(true);
$('gDisconnect').onclick = () => {
  if(!confirm('Google Drive uzilsinmi? Vazifalar shu qurilmada qoladi.')) return;
  try{ if(sync.token && window.google) google.accounts.oauth2.revoke(sync.token, () => {}); }catch(e){}
  Object.assign(sync, { token:'', exp:0, connected:false, fileId:'', lastSync:0 }); saveSync(); renderSyncUI();
};

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(purgeDone()){ saveLocal(); sync.dirty = true; saveSync(); }
  render(); if(tokenValid()) doSync();
});
window.addEventListener('online', () => { if(tokenValid()) doSync(); });

/* ================= Install / SW ================= */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBtn').hidden = false; });
$('installBtn').onclick = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').hidden = true;
};
window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; toast('Ilova o\'rnatildi'); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ================= Start ================= */
if(purgeDone()){ saveLocal(); sync.dirty = true; saveSync(); }
render();
if(sync.connected){
  loadGis().catch(() => {});
  if(tokenValid()) doSync();
}
})();
</script>
</body>
</html>
